<text x="470.00" y="132.00" text-anchor="start" font-size="13.5" fill="var(--ink-2)">内部公共边：两个方向各走一次</text>
<text x="470.00" y="156.00" text-anchor="start" font-size="13.5" fill="var(--ink-2)">两段的积分相加正好为零，</text>
<text x="470.00" y="178.00" text-anchor="start" font-size="13.5" fill="var(--ink-2)">于是把所有小方格的边界加起来，</text>
<text x="470.00" y="200.00" text-anchor="start" font-size="13.5" fill="var(--ink-2)">只剩最外面那一圈 C。</text>
<text x="470.00" y="252.00" text-anchor="start" font-size="13.5" fill="var(--ink-2)">每个小方格上，可微性把被积</text>
<text x="470.00" y="274.00" text-anchor="start" font-size="13.5" fill="var(--ink-2)">函数拆成三块：常数项与一次</text>
<text x="470.00" y="296.00" text-anchor="start" font-size="13.5" fill="var(--ink-2)">项沿闭路积分都是零，只剩一</text>
<text x="470.00" y="318.00" text-anchor="start" font-size="13.5" fill="var(--ink-2)">个比边长更高阶的小量。</text>
<text x="470.00" y="372.00" text-anchor="start" font-size="13.5" fill="var(--ink-2)">格子切得越细，剩下的越少；</text>
<text x="470.00" y="394.00" text-anchor="start" font-size="13.5" fill="var(--ink-2)">外圈积分与切法无关，只能是零。</text>
</svg>
