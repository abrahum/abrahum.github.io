<text x="24.00" y="32.00" text-anchor="start" font-size="14.5" fill="var(--ink-2)">把区域剖成小方格，每条内部边都被两个格子各走一次</text>
<text x="187.32" y="187.80" text-anchor="middle" font-size="17" fill="var(--ink)">D</text>
<text x="64.00" y="152.00" text-anchor="end" font-size="16" fill="var(--ink)">∂D</text>
<line x1="68.00" y1="156.00" x2="74.00" y2="168.00" stroke="var(--ink-3)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24.00" y="396.00" text-anchor="start" font-size="13.5" fill="var(--ink-2)">涂深的两格共用一条边：一个向上走，一个向下走，</text>
<text x="24.00" y="418.00" text-anchor="start" font-size="13.5" fill="var(--ink-2)">同一条线上两次，方向相反，相加为零。</text>
<text x="396.00" y="44.00" text-anchor="start" font-size="15.5" fill="var(--ink)" font-weight="600">格林公式的分割论证</text>
<text x="396.00" y="92.00" text-anchor="start" font-size="14" fill="var(--ink-2)">在每个小方格上，格林公式退化成</text>
<text x="396.00" y="116.00" text-anchor="start" font-size="14" fill="var(--ink-2)">一件几乎不必证明的事：</text>
<text x="396.00" y="152.00" text-anchor="start" font-size="14.5" fill="var(--ink)">闭环积分 ＝（Qx − Py）ΔxΔy</text>
<text x="396.00" y="192.00" text-anchor="start" font-size="14" fill="var(--ink-2)">内部边同时属于左右两格，</text>
<text x="396.00" y="216.00" text-anchor="start" font-size="14" fill="var(--ink-2)">两次经过方向相反，相加为零。</text>
<text x="396.00" y="256.00" text-anchor="start" font-size="14" fill="var(--ink-2)">剩下的只有区域外边界上的那一圈。</text>
<text x="396.00" y="296.00" text-anchor="start" font-size="14" fill="var(--ink-2)">把所有小方格加起来：</text>
<text x="396.00" y="330.00" text-anchor="start" font-size="14.5" fill="var(--ink)">∮ P dx + Q dy ＝ ∬（Qx − Py）dxdy</text>
<text x="396.00" y="370.00" text-anchor="start" font-size="14" fill="var(--ink-2)">左边绕边界走一圈，右边把内部数一遍。</text>
<text x="396.00" y="394.00" text-anchor="start" font-size="14" fill="var(--ink-2)">同一个区域的两种读法。</text>
</svg>
