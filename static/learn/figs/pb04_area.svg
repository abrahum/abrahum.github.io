<svg viewBox="0 0 720 400" role="img" aria-hidden="true"  xmlns="http://www.w3.org/2000/svg">
<text x="28.00" y="38.00" text-anchor="start" font-size="14.5" fill="var(--ink)">某厂 100 人：女工 40 人，其中 24 人戴眼镜，16 人不戴</text>
<rect x="64.00" y="92.00" width="250.00" height="200.00" fill="var(--paper)" stroke="var(--ink-3)" stroke-width="1.3"/>
<rect x="64.00" y="92.00" width="100.00" height="200.00" fill="var(--fig-fill)" stroke="var(--ink-3)" stroke-width="1.1"/>
<rect x="64.00" y="92.00" width="100.00" height="120.00" fill="var(--fig-fill-2)" stroke="var(--accent-line)" stroke-width="1.8"/>
<text x="114.00" y="158.00" text-anchor="middle" font-size="17" fill="var(--ink)">24</text>
<text x="114.00" y="258.00" text-anchor="middle" font-size="15.5" fill="var(--ink-2)">16</text>
<text x="239.00" y="188.00" text-anchor="middle" font-size="13.5" fill="var(--ink-2)">B 以外</text>
<text x="239.00" y="208.00" text-anchor="middle" font-size="13.5" fill="var(--ink-2)">60 人</text>
<text x="189.00" y="318.00" text-anchor="middle" font-size="13.5" fill="var(--ink-2)">Ω：100 人，分母是 100</text>
<line x1="90.00" y1="104.00" x2="60.00" y2="122.00" stroke="var(--ink-3)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="52.00" y="124.00" text-anchor="end" font-size="13.5" fill="var(--accent-line)">A∩B</text>
<line x1="90.00" y1="282.00" x2="60.00" y2="294.00" stroke="var(--ink-3)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="52.00" y="296.00" text-anchor="end" font-size="12.5" fill="var(--ink-3)">女工其余</text>
<text x="64.00" y="80.00" text-anchor="start" font-size="13" fill="var(--ink-2)">B（女工）</text>
<text x="356.00" y="200.00" text-anchor="middle" font-size="12.5" fill="var(--ink-3)">只看 B</text>
<line x1="330.00" y1="214.00" x2="392.00" y2="214.00" stroke="var(--ink-3)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 383.64 217.34 L 392.00 214.00 L 383.64 210.66" fill="var(--ink-3)" stroke="var(--ink-3)" stroke-width="1" stroke-linejoin="round"/>
<rect x="424.00" y="92.00" width="250.00" height="200.00" fill="var(--fig-fill)" stroke="var(--ink-3)" stroke-width="1.1"/>
<rect x="424.00" y="92.00" width="250.00" height="120.00" fill="var(--fig-fill-2)" stroke="var(--accent-line)" stroke-width="1.8"/>
<text x="549.00" y="148.00" text-anchor="middle" font-size="16" fill="var(--ink)">24 / 40 = 0.6</text>
<text x="549.00" y="258.00" text-anchor="middle" font-size="14" fill="var(--ink-2)">16 / 40 = 0.4</text>
<text x="549.00" y="318.00" text-anchor="middle" font-size="13.5" fill="var(--ink-2)">B：40 人，分母换成 40</text>
<text x="28.00" y="350.00" text-anchor="start" font-size="13.5" fill="var(--ink-2)">阴影占 B 的比例一直是 60%，变的只有分母：全厂口径是 24/100，女工口径是 24/40。</text>
<text x="28.00" y="374.00" text-anchor="start" font-size="13.5" fill="var(--ink-3)">条件概率 P(A|B) 记的就是右边这个数。</text>
</svg>
