<circle cx="279.77" cy="162.05" r="4.8" fill="var(--prussian)"/>
<text x="270.77" y="149.05" text-anchor="end" font-size="15" fill="var(--prussian)" font-weight="600">P</text>
<text x="349.99" y="225.97" text-anchor="start" font-size="12.5" fill="var(--ink)">x 方向</text>
<text x="244.63" y="173.98" text-anchor="end" font-size="12.5" fill="var(--ink)">y 方向</text>
<line x1="26.00" y1="36.00" x2="56.00" y2="36.00" stroke="var(--accent-line)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64.00" y="41.00" text-anchor="start" font-size="12.5" fill="var(--ink-2)">截线：y = −0.35 与 x = 0.45</text>
<line x1="26.00" y1="62.00" x2="56.00" y2="62.00" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/>
<text x="64.00" y="67.00" text-anchor="start" font-size="12.5" fill="var(--ink-2)">P 处的两条切线</text>
<text x="446.00" y="44.00" text-anchor="start" font-size="15.5" fill="var(--ink)" font-weight="600">同一点，两个不同的变化率</text>
<text x="446.00" y="76.00" text-anchor="start" font-size="13.5" fill="var(--ink-2)">z = 1.5 − 0.85x² − 0.35y²</text>
<text x="446.00" y="100.00" text-anchor="start" font-size="13.5" fill="var(--ink-2)">P = (0.45, −0.35)</text>
<text x="446.00" y="142.00" text-anchor="start" font-size="12.5" fill="var(--ink-3)">把 y 当常数，对 x 求导</text>
<text x="446.00" y="168.00" text-anchor="start" font-size="14.5" fill="var(--ink)">f_x(P) = −1.70x = −0.77</text>
<text x="446.00" y="206.00" text-anchor="start" font-size="12.5" fill="var(--ink-3)">把 x 当常数，对 y 求导</text>
<text x="446.00" y="232.00" text-anchor="start" font-size="14.5" fill="var(--ink)">f_y(P) = −0.70y = +0.24</text>
<line x1="446.00" y1="252.00" x2="702.00" y2="252.00" stroke="var(--ink-3)" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
<text x="446.00" y="278.00" text-anchor="start" font-size="13" fill="var(--ink-2)">沿斜方向 (1, 1)/√2 走，</text>
<text x="446.00" y="300.00" text-anchor="start" font-size="13" fill="var(--ink-2)">两个斜率各乘 1/√2 再相加：</text>
<text x="446.00" y="330.00" text-anchor="start" font-size="13.5" fill="var(--ink-2)">(−0.77) / √2 + (+0.24) / √2</text>
<text x="446.00" y="356.00" text-anchor="start" font-size="14.5" fill="var(--ink)">= −0.37</text>
<text x="446.00" y="396.00" text-anchor="start" font-size="12.5" fill="var(--ink-3)">一个大、一个小、一个中间值，</text>
<text x="446.00" y="416.00" text-anchor="start" font-size="12.5" fill="var(--ink-3)">三个数都属于同一个点。</text>
</svg>
