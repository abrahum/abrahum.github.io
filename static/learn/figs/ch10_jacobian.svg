<text x="28.00" y="32.00" text-anchor="start" font-size="15.5" fill="var(--ink)" font-weight="600">一，(u, v) 平面：方格</text>
<text x="28.00" y="58.00" text-anchor="start" font-size="13" fill="var(--ink-2)">换元前，区域是四四方方的：</text>
<text x="28.00" y="80.00" text-anchor="start" font-size="13" fill="var(--ink-2)">每一格面积都是同一个数，</text>
<text x="28.00" y="102.00" text-anchor="start" font-size="13" fill="var(--ink-2)">界也容易写：u 从 0 到 1，v 从 0 到 1。</text>
<text x="330.00" y="32.00" text-anchor="start" font-size="15.5" fill="var(--ink)" font-weight="600">二，(x, y) 平面：方格被拉斜</text>
<text x="330.00" y="58.00" text-anchor="start" font-size="13" fill="var(--ink-2)">直线仍是直线，平行仍是平行，</text>
<text x="330.00" y="80.00" text-anchor="start" font-size="13" fill="var(--ink-2)">直角却没了；每格面积都乘同一个数。</text>
