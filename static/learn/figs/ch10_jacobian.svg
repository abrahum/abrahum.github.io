<text x="28.00" y="396.00" text-anchor="start" font-size="13.5" fill="var(--ink-2)">det J = 1 × 1.2 − 0.6 × 0.4 = 0.96；高亮格从 0.25 变成 0.24，两块面积之比正好是 0.96。</text>
<text x="28.00" y="420.00" text-anchor="start" font-size="13.5" fill="var(--ink-3)">换元公式里的绝对值就取在这里：行列式可以为负，面积不能。</text>
