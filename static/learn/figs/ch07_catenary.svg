<text x="604.67" y="150.15" text-anchor="start" font-size="13" fill="var(--prussian)">差 0.30</text>
<text x="107.73" y="91.00" text-anchor="start" font-size="13.5" fill="var(--prussian)">y = cosh x − 1</text>
<text x="184.00" y="197.10" text-anchor="start" font-size="13.5" fill="var(--ink-2)">y = x² / 2</text>
<text x="26.00" y="344.00" text-anchor="start" font-size="13.5" fill="var(--ink-2)">cosh x − 1 = x²/2 + x⁴/24 + ⋯，两条曲线到三阶都一样，四阶项才把它们拆开。</text>
<text x="26.00" y="368.00" text-anchor="start" font-size="13.5" fill="var(--ink-2)">雅各布·伯努利 1691 年在《教师学报》上征集这个问题，莱布尼茨、惠更斯与约翰·伯努利在同一年给出答案。</text>
<text x="26.00" y="392.00" text-anchor="start" font-size="13" fill="var(--ink-3)">被填色的两层之间，就是「用抛物线凑」时会漏掉的那部分高度。</text>
</svg>
