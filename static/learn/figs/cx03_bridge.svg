<text x="346.40" y="288.00" text-anchor="middle" font-size="14" fill="var(--prussian)">桥</text>
<text x="86.00" y="328.00" text-anchor="end" font-size="14" fill="var(--accent-line)">C₀</text>
<text x="196.00" y="340.00" text-anchor="end" font-size="14" fill="var(--accent-line)">C₁</text>
<text x="452.00" y="118.00" text-anchor="start" font-size="13.5" fill="var(--ink-2)">外边界 C₀ 逆时针走，内边界</text>
<text x="452.00" y="140.00" text-anchor="start" font-size="13.5" fill="var(--ink-2)">C₁ 顺时针走，再用桥接起来。</text>
<text x="452.00" y="176.00" text-anchor="start" font-size="13.5" fill="var(--ink-2)">沿外圈一圈，拐进桥，绕内圈</text>
<text x="452.00" y="198.00" text-anchor="start" font-size="13.5" fill="var(--ink-2)">反向一圈，再从桥走回来。</text>
<text x="452.00" y="234.00" text-anchor="start" font-size="13.5" fill="var(--ink-2)">桥上的两段方向相反，积分</text>
<text x="452.00" y="256.00" text-anchor="start" font-size="13.5" fill="var(--ink-2)">一正一负，正好抵消。</text>
<text x="452.00" y="296.00" text-anchor="start" font-size="13.5" fill="var(--ink-2)">f 沿这条闭路的积分为零，</text>
<text x="452.00" y="318.00" text-anchor="start" font-size="13.5" fill="var(--ink-2)">外圈的积分等于内圈之和。</text>
<text x="24.00" y="434.00" text-anchor="start" font-size="13.5" fill="var(--ink-3)">桥可以随意弯曲、随意挪位置，只要不穿过洞，抵消的方式不变。</text>
</svg>
