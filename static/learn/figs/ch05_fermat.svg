<text x="452.00" y="76.00" text-anchor="start" font-size="15.5" fill="var(--ink)" font-weight="600">同一个公式，四个公比</text>
<text x="452.00" y="122.00" text-anchor="start" font-size="14.5" fill="var(--ink-2)">r = 0.60     和 = 0.184</text>
<text x="452.00" y="156.00" text-anchor="start" font-size="14.5" fill="var(--ink-2)">r = 0.80     和 = 0.262</text>
<text x="452.00" y="190.00" text-anchor="start" font-size="14.5" fill="var(--ink-2)">r = 0.90     和 = 0.299</text>
<text x="452.00" y="224.00" text-anchor="start" font-size="14.5" fill="var(--ink-2)">r = 0.99     和 = 0.330</text>
<text x="452.00" y="258.00" text-anchor="start" font-size="14.5" fill="var(--ink)">真值            0.333</text>
<text x="452.00" y="306.00" text-anchor="start" font-size="13.5" fill="var(--ink-2)">公比越接近 1，竖条越窄，</text>
<text x="452.00" y="328.00" text-anchor="start" font-size="13.5" fill="var(--ink-2)">和越靠近 1/3。</text>
<text x="452.00" y="362.00" text-anchor="start" font-size="13.5" fill="var(--ink-2)">费马写的是「令 r 等于 1」，</text>
<text x="452.00" y="384.00" text-anchor="start" font-size="13.5" fill="var(--ink-2)">不是「令 r 趋于 1」。</text>
