<text x="582.00" y="152.00" text-anchor="start" font-size="11.5" fill="var(--ink-2)">C₁₁ 的配方</text>
<text x="40.00" y="258.00" text-anchor="start" font-size="13.5" fill="var(--ink-2)">C₁₁ = A₁₁B₁₁ + A₁₂B₂₁ = 2·1 + 1·2 = 4</text>
<text x="40.00" y="290.00" text-anchor="start" font-size="13.5" fill="var(--ink-2)">C₁₂ = A₁₁B₁₂ + A₁₂B₂₂ = 2·4 + 1·1 = 9</text>
<text x="382.00" y="258.00" text-anchor="start" font-size="13.5" fill="var(--ink-2)">C₂₁ = A₂₁B₁₁ + A₂₂B₂₁ = 0·1 + 3·2 = 6</text>
<text x="382.00" y="290.00" text-anchor="start" font-size="13.5" fill="var(--ink-2)">C₂₂ = A₂₁B₁₂ + A₂₂B₂₂ = 0·4 + 3·1 = 3</text>
<text x="40.00" y="328.00" text-anchor="start" font-size="12.5" fill="var(--ink-3)">块的行列数不必相等，只要 A 的列分法与 B 的行分法一致，块就能当数一样相乘。</text>
