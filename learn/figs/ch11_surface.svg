<text x="168.23" y="191.76" text-anchor="end" font-size="16" fill="var(--ink)">γ</text>
<circle cx="179.81" cy="219.73" r="3.4" fill="var(--prussian)"/>
<text x="173.81" y="207.73" text-anchor="end" font-size="15" fill="var(--ink)">ΔS</text>
<text x="185.81" y="336.72" text-anchor="middle" font-size="14" fill="var(--ink)">ΔxΔy</text>
<text x="134.43" y="150.59" text-anchor="end" font-size="15" fill="var(--prussian)">n</text>
<text x="187.81" y="132.34" text-anchor="start" font-size="13.5" fill="var(--ink-2)">z 轴</text>
<text x="49.62" y="214.12" text-anchor="middle" font-size="17" fill="var(--ink)">Σ</text>
<text x="30.00" y="424.00" text-anchor="start" font-size="14" fill="var(--ink-2)">ΔxΔy ＝ ΔS cos γ：曲面越斜，投影越小</text>
<text x="356.00" y="44.00" text-anchor="start" font-size="15.5" fill="var(--ink)" font-weight="600">同一块曲面，两种积分</text>
<text x="356.00" y="92.00" text-anchor="start" font-size="14" fill="var(--ink-2)">第一类（对面积）∬ f dS：</text>
<text x="356.00" y="116.00" text-anchor="start" font-size="14" fill="var(--ink-2)">把曲面割成小块，只量面积，</text>
<text x="356.00" y="140.00" text-anchor="start" font-size="14" fill="var(--ink-2)">与方向无关，故 dS 不小于零。</text>
<text x="356.00" y="180.00" text-anchor="start" font-size="14" fill="var(--ink-2)">第二类（对坐标）∬ R dxdy：</text>
<text x="356.00" y="204.00" text-anchor="start" font-size="14" fill="var(--ink-2)">量的是穿过曲面的通量，投影</text>
<text x="356.00" y="228.00" text-anchor="start" font-size="14" fill="var(--ink-2)">带正负号，dxdy ＝ cos γ dS。</text>
<text x="356.00" y="268.00" text-anchor="start" font-size="14" fill="var(--ink-2)">所以 R dxdy 与 R cos γ dS 是</text>
<text x="356.00" y="292.00" text-anchor="start" font-size="14" fill="var(--ink-2)">同一个积分的两种写法，</text>
<text x="356.00" y="316.00" text-anchor="start" font-size="14" fill="var(--ink-2)">差别只在用哪把尺去量。</text>
<text x="356.00" y="356.00" text-anchor="start" font-size="14" fill="var(--ink-2)">cos γ 为零时，曲面垂直于 xOy 面，</text>
<text x="356.00" y="380.00" text-anchor="start" font-size="14" fill="var(--ink-2)">通量也为零：没有东西穿过去。</text>
</svg>
