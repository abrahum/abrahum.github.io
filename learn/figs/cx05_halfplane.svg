<text x="346.00" y="202.73" text-anchor="end" font-size="15" fill="var(--ink)" font-style="italic">z = i</text>
<text x="346.00" y="224.73" text-anchor="end" font-size="13" fill="var(--ink-2)">一阶极点，留数 e⁻¹/(2i)</text>
<text x="52.00" y="36.00" text-anchor="start" font-size="14.5" fill="var(--ink-2)">在上半平面绕一大圈，把实轴上的积分换成留数</text>
<text x="470.00" y="62.00" text-anchor="start" font-size="13" fill="var(--ink-3)">弧长 πR，|f| ≤ M(R)</text>
<text x="470.00" y="84.00" text-anchor="start" font-size="13" fill="var(--ink-3)">R 一大，这段积分趋于 0</text>
<text x="452.00" y="244.00" text-anchor="start" font-size="13" fill="var(--ink-2)">实轴段 + 大半圆 = 2πi·留数和</text>
<text x="452.00" y="266.00" text-anchor="start" font-size="13" fill="var(--ink-2)">半圆那一项没了，实积分就出来</text>
<text x="452.00" y="300.00" text-anchor="start" font-size="12.5" fill="var(--ink-3)">下半平面的极点在围道外，不进总和</text>
