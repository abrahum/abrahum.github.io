<text x="453.29" y="355.39" text-anchor="end" font-size="12.5" fill="var(--ink-2)">内弧 rΔθ</text>
<text x="352.00" y="32.00" text-anchor="start" font-size="15.5" fill="var(--ink)" font-weight="600">二，映射到平面上：矩形变成扇环</text>
<text x="352.00" y="58.00" text-anchor="start" font-size="13" fill="var(--ink-2)">两条弧不等长，所以这一块不是矩形，</text>
<text x="352.00" y="80.00" text-anchor="start" font-size="13" fill="var(--ink-2)">面积要按扇环来算，不能直接乘。</text>
<text x="28.00" y="398.00" text-anchor="start" font-size="13.5" fill="var(--ink-2)">取 r = 1.1、Δr = 0.8、Δθ = 0.50：扇环面积 0.60，按内弧补成的矩形 0.44，</text>
<text x="28.00" y="420.00" text-anchor="start" font-size="13.5" fill="var(--ink-2)">多出 0.16，占 27%。把 Δr 缩到 0.08，同一块的多余部分只剩 0.0016，占 3.5%。</text>
<text x="28.00" y="446.00" text-anchor="start" font-size="13.5" fill="var(--ink-3)">它随 Δr 一起消失，主项却留下 r Δr Δθ：dσ = r dr dθ 里的 r 就是内弧长 rΔθ 的那个 r。</text>
