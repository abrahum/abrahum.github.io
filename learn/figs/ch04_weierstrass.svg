<text x="180.00" y="30.00" text-anchor="middle" font-size="15" fill="var(--ink)" font-weight="600">单位圆上的有理参数化</text></g>
<g transform="translate(360,0)"><text x="22.00" y="60.00" text-anchor="start" font-size="15.5" fill="var(--ink)" font-weight="600">万能代换</text>
<text x="22.00" y="90.00" text-anchor="start" font-size="15" fill="var(--ink)">t = tan(x/2)</text>
<text x="22.00" y="120.00" text-anchor="start" font-size="14.5" fill="var(--ink-2)">x = 2 arctan t</text>
<text x="22.00" y="150.00" text-anchor="start" font-size="14.5" fill="var(--ink-2)">sin x = 2t / (1+t²)</text>
<text x="22.00" y="180.00" text-anchor="start" font-size="14.5" fill="var(--ink-2)">cos x = (1-t²) / (1+t²)</text>
<text x="22.00" y="210.00" text-anchor="start" font-size="14.5" fill="var(--ink-2)">dx = 2 dt / (1+t²)</text>
<text x="22.00" y="252.00" text-anchor="start" font-size="13.5" fill="var(--ink-3)">x 从 -π 走到 π 时，t 从负无穷走到正无穷，</text>
<text x="22.00" y="282.00" text-anchor="start" font-size="13.5" fill="var(--ink-3)">圆上除 (-1,0) 外的每一点恰好被走过一次。</text>
<text x="22.00" y="324.00" text-anchor="start" font-size="13.5" fill="var(--ink-3)">三角函数都成了 t 的有理式，</text>
<text x="22.00" y="354.00" text-anchor="start" font-size="13.5" fill="var(--ink-3)">三角有理式的积分也就化成了有理函数的积分。</text></g>
