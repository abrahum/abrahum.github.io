<path d="M 213.52 225.00 L 213.48 223.28 L 213.35 221.56 L 213.14 219.86 L 212.84 218.16 L 212.45 216.49 L 211.99 214.83 L 211.44 213.21 L 210.81 211.61 L 210.10 210.04 L 209.32 208.52 L 208.46 207.03 L 207.53 205.60 L 206.52 204.21 L 205.45 202.88 L 204.32 201.60 L 203.12 200.38 L 201.86 199.23 L 200.55 198.14 L 199.18 197.12 L 197.77 196.17 L 196.31 195.29 L 194.80 194.49 L 193.26 193.77 L 191.69 193.13 L 190.08 192.57 L 188.45 192.10 L 186.80 191.71 L 185.13 191.40 L 183.45 191.18 L 181.76 191.05 L 180.06 191.00 L 178.37 191.04 L 176.68 191.17 L 174.99 191.38 L 173.32 191.68 L 171.67 192.07 L 170.04 192.54 L 168.43 193.09 L 166.85 193.72 L 165.31 194.44" fill="none" stroke="var(--accent-line)" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/>
