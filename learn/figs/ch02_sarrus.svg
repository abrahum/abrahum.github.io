<text x="400.00" y="120.00" text-anchor="start" font-size="14" fill="var(--ink)">3·4·3 = 36</text>
<text x="400.00" y="144.00" text-anchor="start" font-size="14" fill="var(--ink)">1·1·1 = 1</text>
<text x="400.00" y="168.00" text-anchor="start" font-size="14" fill="var(--ink)">2·2·5 = 20</text>
<text x="400.00" y="192.00" text-anchor="start" font-size="14" fill="var(--ink-2)">合计 57</text>
<text x="400.00" y="240.00" text-anchor="start" font-size="15" fill="var(--ink-2)">↗ 三条右上斜线，取负</text>
<text x="400.00" y="268.00" text-anchor="start" font-size="14" fill="var(--ink)">1·4·2 = 8</text>
<text x="400.00" y="292.00" text-anchor="start" font-size="14" fill="var(--ink)">5·1·3 = 15</text>
<text x="400.00" y="316.00" text-anchor="start" font-size="14" fill="var(--ink)">3·2·1 = 6</text>
<text x="400.00" y="340.00" text-anchor="start" font-size="14" fill="var(--ink-2)">合计 29</text>
<text x="400.00" y="388.00" text-anchor="start" font-size="16" fill="var(--ink)">行列式 = 28</text>
<text x="56.00" y="414.00" text-anchor="start" font-size="13" fill="var(--ink-2)">六条斜线正好穷尽三个数不同行不同列六种取法，所以三阶只要画线就能算完。</text>
