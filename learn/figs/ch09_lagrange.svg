<text x="452.00" y="92.00" text-anchor="start" font-size="13.5" fill="var(--ink-2)">g(x, y) = x² + y² = 4</text>
<text x="452.00" y="116.00" text-anchor="start" font-size="13.5" fill="var(--ink-2)">f(x, y) = x + 2y</text>
<text x="452.00" y="156.00" text-anchor="start" font-size="12.5" fill="var(--ink-3)">f = 2</text>
<text x="518.00" y="156.00" text-anchor="start" font-size="12.5" fill="var(--ink-3)">交于两点，还能更大</text>
<text x="452.00" y="180.00" text-anchor="start" font-size="12.5" fill="var(--accent-line)">f = 2√5</text>
<text x="518.00" y="180.00" text-anchor="start" font-size="12.5" fill="var(--accent-line)">相切，就是最大值</text>
<text x="452.00" y="204.00" text-anchor="start" font-size="12.5" fill="var(--ink-3)">f = 5.5</text>
<text x="518.00" y="204.00" text-anchor="start" font-size="12.5" fill="var(--ink-3)">与圆无交点</text>
<line x1="452.00" y1="226.00" x2="706.00" y2="226.00" stroke="var(--ink-3)" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
<text x="452.00" y="254.00" text-anchor="start" font-size="13" fill="var(--ink-2)">切点 P = (0.89, 1.79)</text>
<text x="452.00" y="278.00" text-anchor="start" font-size="13" fill="var(--ink-2)">∇f = (1, 2)</text>
<text x="452.00" y="302.00" text-anchor="start" font-size="13" fill="var(--ink-2)">∇g = (1.79, 3.58)</text>
<text x="452.00" y="330.00" text-anchor="start" font-size="14.5" fill="var(--ink)">∇f = λ∇g</text>
<text x="452.00" y="354.00" text-anchor="start" font-size="13.5" fill="var(--ink)">λ = 1 / 1.79 = 0.56</text>
<text x="452.00" y="396.00" text-anchor="start" font-size="12.5" fill="var(--ink-3)">相切处两个梯度平行，</text>
<text x="452.00" y="416.00" text-anchor="start" font-size="12.5" fill="var(--ink-3)">λ 就是它们的长度之比。</text>
